name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # 数据包签名与篡改测试需要真实的 minisign 二进制（生产镜像中由 Dockerfile 安装）
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign && minisign -v
      - run: pip install -r requirements.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check --output-format=github . && ruff format --check .
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | head -10 | sed 's/^/::error::/'
            grep -E "^E  " pytest.log | head -10 | sed 's/^/::error title=detail::/'
            exit 1
          }
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: scanner/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      # Verifies every module against sum.golang.org, then the local cache against go.sum.
      - name: Verify dependencies
        working-directory: scanner
        run: go mod download && go mod verify
      - name: Format, vet, unit tests
        working-directory: scanner
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Build static binary
        working-directory: scanner
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=ci-${GITHUB_SHA::7}" -o ../dist/secwatch ./cmd/secwatch
          go build -o ../dist/mkbundle ./internal/tools/mkbundle
          ../dist/secwatch version
      - name: Real-distro container tests
        run: scanner/testdata/integration/run.sh dist/secwatch dist/mkbundle
