name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # 数据包签名与篡改测试需要真实的 minisign 二进制（生产镜像中由 Dockerfile 安装）
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign && minisign -v
      - run: pip install -r requirements.lock
      - run: pip install --no-deps --no-build-isolation -e .
      - run: ruff check --output-format=github . && ruff format --check .
      - name: pytest
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            grep -E "^(FAILED|ERROR) " pytest.log | head -10 | sed 's/^/::error::/'
            grep -E "^E  " pytest.log | head -10 | sed 's/^/::error title=detail::/'
            exit 1
          }
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Always the newest stable Go: the binaries carry its standard
          # library, and older lines stop receiving security fixes.
          go-version: stable
          cache-dependency-path: scanner/go.sum
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends minisign
      # Verifies every module against sum.golang.org, then the local cache against go.sum.
      - name: Verify dependencies
        working-directory: scanner
        run: go mod download && go mod verify
      - name: Format, vet, unit tests
        working-directory: scanner
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - name: Build static binary
        working-directory: scanner
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.Version=ci-${GITHUB_SHA::7}" -o ../dist/secwatch ./cmd/secwatch
          go build -o ../dist/mkbundle ./internal/tools/mkbundle
          ../dist/secwatch version
      # Known vulnerabilities that the scanner's code can actually reach, in
      # its dependencies and the Go standard library. Reported as warnings;
      # Dependabot opens the upgrade PRs.
      - name: govulncheck
        working-directory: scanner
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Real-distro container tests
        run: scanner/testdata/integration/run.sh dist/secwatch dist/mkbundle
      - name: Installer
        shell: bash
        run: |
          shellcheck -s sh -S warning scanner/install.sh
          (cd scanner && go build -o ../dist/sigtool ./internal/tools/sigtool)
          # Once the release key exists, install.sh must embed exactly that key.
          if [ -f keys/release-signing.pub ]; then
            dist/sigtool pubinfo -pub keys/release-signing.pub > "$RUNNER_TEMP/release-consts"
            while IFS= read -r line; do
              grep -qxF "$line" scanner/install.sh || { echo "::error title=installer::install.sh does not embed keys/release-signing.pub"; exit 1; }
            done < "$RUNNER_TEMP/release-consts"
          else
            echo "::warning title=installer::keys/release-signing.pub not added yet; releases are blocked until it is"
          fi
          # Full round trip with a throwaway key made and used by the real minisign CLI.
          T="$RUNNER_TEMP/install"; mkdir -p "$T/dist"
          v="ci-${GITHUB_SHA::7}"
          cp dist/secwatch "$T/dist/secwatch-linux-amd64"
          minisign -G -W -p "$T/test.pub" -s "$T/test.key" > /dev/null
          dist/sigtool pubinfo -pub "$T/test.pub" > "$T/consts"
          . "$T/consts"
          sed -e "s|^KEY_ID=.*|KEY_ID='$KEY_ID'|" -e "s|^KEY_ID_RAW=.*|KEY_ID_RAW='$KEY_ID_RAW'|" \
              -e "s|^MINISIGN_PUB=.*|MINISIGN_PUB='$MINISIGN_PUB'|" -e "s|^PUB_PEM=.*|PUB_PEM='$PUB_PEM'|" \
              scanner/install.sh > "$T/install.sh"
          (cd "$T/dist" && sha256sum secwatch-linux-amd64 > SHA256SUMS)
          minisign -S -s "$T/test.key" -m "$T/dist/SHA256SUMS" -t "secwatch release=$v file=SHA256SUMS" < /dev/null
          scanner/testdata/install/run.sh "$T/dist" "$T/install.sh" "$v" dist/sigtool
