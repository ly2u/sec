<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LY2U SecWatch{% endblock %}</title>
<meta name="description" content="{% block description %}面向 VPS 和自建服务器的漏洞情报与只读自检工具{% endblock %}">
<link rel="stylesheet" href="/static/site.css?v={{ css_version() }}">
<link rel="alternate" type="application/rss+xml" title="LY2U SecWatch" href="/rss.xml">
{% block head %}{% endblock %}
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="/">LY2U <span>SecWatch</span></a>
    <nav class="nav" aria-label="主导航">
      <a href="/products">产品</a>
      <a href="/scanner">扫描器</a>
      <a href="/about">关于</a>
    </nav>
    {% block lookup %}
    <form class="lookup-mini" action="/go" method="get" role="search">
      <input id="q-top" type="text" name="id" placeholder="CVE-2024-3094" maxlength="64" autocomplete="off" spellcheck="false" aria-label="漏洞编号">
      <button type="submit">查看</button>
    </form>
    {% endblock %}
  </div>
</header>
<main>
  <div class="wrap">
{% block main %}{% endblock %}
  </div>
</main>
<footer>
  <div class="wrap">
    <span>数据来自 CVE Program、CISA KEV、FIRST EPSS、OSV、Node.js Security WG</span>
    <a href="/about">数据来源与许可</a>
    <a href="/privacy">隐私</a>
    <a href="/security">报告安全问题</a>
    <a href="/rss.xml">RSS</a>
    <a href="/api/v1/openapi.json">API</a>
    <a href="https://github.com/ly2u/sec">源代码</a>
  </div>
</footer>
</body>
</html>
