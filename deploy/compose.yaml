name: secwatch-dev

x-app: &app
  image: secwatch-dev:current
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment:
    DATABASE_URL: postgresql+psycopg://secwatch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project .env}@postgres:5432/secwatch
  read_only: true
  tmpfs:
    - /tmp:size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [private]
  depends_on:
    postgres:
      condition: service_healthy
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: secwatch
      POSTGRES_DB: secwatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in project .env}
    command: [postgres, -c, shared_buffers=256MB, -c, max_connections=50]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [private]
    mem_limit: 4g
    memswap_limit: 4g
    cpus: 2.0
    pids_limit: 128
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U secwatch -d secwatch"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    <<: *app
    ports: ["127.0.0.1:18080:8000"]
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    pids_limit: 64
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  worker:
    <<: *app
    command: [python, -m, collector.cli, idle]
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 64

volumes:
  postgres-data:

networks:
  private:
    driver: bridge
  secwatch-edge:
    name: secwatch-edge
    external: true
